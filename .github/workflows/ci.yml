name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Set up Python (supported: 3.10)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: mypy src scripts tests

      - name: Run tests
        run: pytest -q

      - name: Regenerate portfolio artifacts
        run: make portfolio-artifacts

      - name: Verify artifacts are up-to-date with committed versions
        run: |
          git diff --exit-code results/benchmark_runs/ \
            || { echo "::error::Committed artifacts under results/benchmark_runs/ are out of sync with reporting.py. Run 'make portfolio-artifacts' and commit the result."; exit 1; }
