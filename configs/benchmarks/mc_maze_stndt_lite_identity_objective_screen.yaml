model_type: stndt_lite
dataset_name: mc_maze
data_path: null
data_prefix: "*full"
bin_size_ms: 5
train_split: train
eval_split: val
include_psth: false
log_offset: 0.001
seed: 0
skip_fields:
  - hand_pos
  - cursor_pos
  - eye_pos
  - muscle_vel
  - muscle_len
  - joint_vel
  - joint_ang
  - force
baseline:
  d_model: 192
  n_layers: 3
  n_heads: 4
  spatial_n_heads: 4
  dropout: 0.05
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 60
  patience: 10
  mask_prob: 0.3
  heldin_loss_weight: 0.3
  validation_fraction: 0.05
  input_transform: sqrt_zscore
  seed: 0
  lr_schedule: constant
  contrast_loss_weight: 0.0
  contrast_mask_prob: 0.05
  contrast_temperature: 0.07
  ensemble_size: 1
  device: auto
improvement:
  cv_folds: 2
  n_heads: 4
  spatial_n_heads: 4
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 60
  patience: 10
  heldin_loss_weight: 0.3
  validation_fraction: 0.05
  input_transform: sqrt_zscore
  seed: 0
  contrast_mask_prob: 0.05
  contrast_temperature: 0.07
  ensemble_size: 1
  device: auto
  candidates:
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.3, lr_schedule: constant, contrast_loss_weight: 0.0}
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.3, lr_schedule: constant, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05}
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.3, lr_schedule: constant, contrast_loss_weight: 0.0, spike_loss_weight: 1.0}
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.3, lr_schedule: constant, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05, spike_loss_weight: 1.0}
output_dir: results/benchmark_runs/stndt_lite_identity_objective_screen
