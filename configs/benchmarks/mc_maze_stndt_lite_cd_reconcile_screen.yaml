model_type: stndt_lite
dataset_name: mc_maze
data_path: null
data_prefix: "*full"
bin_size_ms: 5
train_split: train
eval_split: val
include_psth: false
log_offset: 0.001
seed: 0
skip_fields:
  - hand_pos
  - cursor_pos
  - eye_pos
  - muscle_vel
  - muscle_len
  - joint_vel
  - joint_ang
  - force
baseline:
  d_model: 192
  n_layers: 3
  n_heads: 4
  spatial_n_heads: 4
  dropout: 0.05
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 60
  patience: 10
  mask_prob: 0.3
  heldin_loss_weight: 0.3
  validation_fraction: 0.05
  input_transform: sqrt_zscore
  seed: 0
  lr_schedule: constant
  contrast_loss_weight: 0.0
  contrast_mask_prob: 0.05
  contrast_temperature: 0.07
  ensemble_size: 1
  device: auto
improvement:
  select_on_full_val_all_candidates: true
  cv_folds: 2
  n_heads: 4
  spatial_n_heads: 4
  weight_decay: 0.0001
  batch_size: 64
  patience: 10
  validation_fraction: 0.05
  input_transform: sqrt_zscore
  seed: 0
  contrast_mask_prob: 0.05
  contrast_temperature: 0.07
  device: auto
  candidates:
    # C1 — identity + spike 5-seed anchor (expect ~0.3209 train/val)
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.3, heldin_loss_weight: 0.3, lr_schedule: constant, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05, spike_loss_weight: 1.0, use_mask_token: false, max_epochs: 60, patience: 10, ensemble_size: 5}
    # C2 — mask token only (mild objective)
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.3, heldin_loss_weight: 0.3, lr_schedule: constant, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05, spike_loss_weight: 1.0, use_mask_token: true, max_epochs: 60, patience: 10, ensemble_size: 5}
    # C3 — higher mask_prob, mild held-in loss
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.5, heldin_loss_weight: 0.3, lr_schedule: constant, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05, spike_loss_weight: 1.0, use_mask_token: true, max_epochs: 60, patience: 10, ensemble_size: 5}
    # C4 — Screen A/B CD knobs + 5-seed ensemble
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.5, heldin_loss_weight: 1.0, lr_schedule: constant, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05, spike_loss_weight: 1.0, use_mask_token: true, max_epochs: 60, patience: 10, ensemble_size: 5}
    # C5 — CD knobs + Screen B schedule + 5-seed ensemble
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.5, heldin_loss_weight: 1.0, lr_schedule: cosine, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05, spike_loss_weight: 1.0, use_mask_token: true, max_epochs: 120, patience: 20, warmup_epochs: 0, ensemble_size: 5}
    # C6 — hybrid: mild held-in + CD mask/token + cosine/120
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.5, heldin_loss_weight: 0.3, lr_schedule: cosine, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05, spike_loss_weight: 1.0, use_mask_token: true, max_epochs: 120, patience: 20, warmup_epochs: 0, ensemble_size: 5}
    # C7 — single-seed CD control (expect ~0.3148 train/val)
    - {d_model: 192, n_layers: 3, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.5, heldin_loss_weight: 1.0, lr_schedule: cosine, contrast_loss_weight: 0.0, temporal_identity_scale: 0.05, spike_loss_weight: 1.0, use_mask_token: true, max_epochs: 120, patience: 20, warmup_epochs: 0, ensemble_size: 1}
output_dir: results/benchmark_runs/stndt_lite_cd_reconcile_screen
