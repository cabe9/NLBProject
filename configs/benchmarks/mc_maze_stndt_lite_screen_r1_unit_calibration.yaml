# Screen R1: unit-specific affine held-out calibration (default-off in code).
# Validation-only. Do not public-test from this screen alone.
#
# heldout_logits_final = a_unit * heldout_logits + b_unit  (a init ~1, b init ~0)
# Training adds scale/bias L2 penalties toward identity.
#
# Gate (strict stop rule):
#   Promote only if best calibrated candidate beats R0 control by >= +0.0015
#   train/val co-bps AND calibration curves improve without hurting total co-bps.
#   If flat: stop (no hidden-state adapter R2). If positive: consider R2 adapter.
model_type: stndt_lite
dataset_name: mc_maze
data_path: null
data_prefix: "*full"
bin_size_ms: 5
train_split: train
eval_split: val
include_psth: false
log_offset: 0.001
seed: 0
skip_fields:
  - hand_pos
  - cursor_pos
  - eye_pos
  - muscle_vel
  - muscle_len
  - joint_vel
  - joint_ang
  - force
baseline:
  d_model: 192
  n_layers: 3
  n_heads: 4
  spatial_n_heads: 4
  dropout: 0.05
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 60
  patience: 10
  mask_prob: 0.3
  heldin_loss_weight: 0.3
  validation_fraction: 0.05
  input_transform: sqrt_zscore
  seed: 0
  lr_schedule: constant
  contrast_loss_weight: 0.0
  contrast_mask_prob: 0.05
  contrast_temperature: 0.07
  ensemble_size: 1
  device: auto
improvement:
  select_on_full_val_all_candidates: true
  cv_folds: 2
  n_heads: 4
  spatial_n_heads: 4
  weight_decay: 0.0001
  batch_size: 64
  validation_fraction: 0.05
  input_transform: sqrt_zscore
  contrast_mask_prob: 0.05
  contrast_temperature: 0.07
  device: auto
  candidates:
    # R0 - lr0013 anchor control (no unit calibration).
    - {
        d_model: 192,
        n_layers: 4,
        dropout: 0.05,
        learning_rate: 0.0013,
        mask_prob: 0.6,
        mask_mode: bernoulli,
        heldin_loss_weight: 1.0,
        lr_schedule: constant,
        contrast_loss_weight: 0.0,
        temporal_identity_scale: 0.05,
        spike_loss_weight: 1.0,
        use_mask_token: true,
        unit_calibration: false,
        max_epochs: 60,
        patience: 10,
        ensemble_size: 5,
        seed: 0,
      }
    # R1a - strong identity regularization.
    - {
        d_model: 192,
        n_layers: 4,
        dropout: 0.05,
        learning_rate: 0.0013,
        mask_prob: 0.6,
        mask_mode: bernoulli,
        heldin_loss_weight: 1.0,
        lr_schedule: constant,
        contrast_loss_weight: 0.0,
        temporal_identity_scale: 0.05,
        spike_loss_weight: 1.0,
        use_mask_token: true,
        unit_calibration: true,
        unit_calibration_scale_reg: 10.0,
        unit_calibration_bias_reg: 10.0,
        max_epochs: 60,
        patience: 10,
        ensemble_size: 5,
        seed: 0,
      }
    # R1b - medium identity regularization.
    - {
        d_model: 192,
        n_layers: 4,
        dropout: 0.05,
        learning_rate: 0.0013,
        mask_prob: 0.6,
        mask_mode: bernoulli,
        heldin_loss_weight: 1.0,
        lr_schedule: constant,
        contrast_loss_weight: 0.0,
        temporal_identity_scale: 0.05,
        spike_loss_weight: 1.0,
        use_mask_token: true,
        unit_calibration: true,
        unit_calibration_scale_reg: 1.0,
        unit_calibration_bias_reg: 1.0,
        max_epochs: 60,
        patience: 10,
        ensemble_size: 5,
        seed: 0,
      }
    # R1c - lighter identity regularization.
    - {
        d_model: 192,
        n_layers: 4,
        dropout: 0.05,
        learning_rate: 0.0013,
        mask_prob: 0.6,
        mask_mode: bernoulli,
        heldin_loss_weight: 1.0,
        lr_schedule: constant,
        contrast_loss_weight: 0.0,
        temporal_identity_scale: 0.05,
        spike_loss_weight: 1.0,
        use_mask_token: true,
        unit_calibration: true,
        unit_calibration_scale_reg: 0.1,
        unit_calibration_bias_reg: 0.1,
        max_epochs: 60,
        patience: 10,
        ensemble_size: 5,
        seed: 0,
      }
output_dir: results/benchmark_runs/stndt_lite_screen_r1_unit_calibration
