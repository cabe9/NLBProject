    - {d_model: 192, n_layers: 2, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.25}
    - {d_model: 192, n_layers: 2, dropout: 0.05, learning_rate: 0.001, mask_prob: 0.35}
