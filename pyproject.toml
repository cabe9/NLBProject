[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlb-project"
version = "0.1.0"
description = "Compact, reproducible NLB'21 neural latent modeling project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{name = "Caleb Telander"}]
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=1.3,<3",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "h5py>=3.9",
  "PyYAML>=6.0",
  "nlb-tools==0.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pip-tools>=7.0",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", "data", ".pytest_cache"]

[tool.ruff.lint]
# Pyflakes, pycodestyle, pyupgrade, isort, bugbear, comprehension tidying.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# Line-length violations are mostly in long log/error strings and comments
# that would read worse split; keep the hard lints (E/F/W) strict otherwise.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
